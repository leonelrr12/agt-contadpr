<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador507 — Iniciar Sesión</title>
  <meta name="description" content="Inicia sesión en Contador507, el agente contable inteligente para Panamá.">
  <meta name="theme-color" content="#1565c0">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      /* Tinta → azul profundo: la paleta de la app (antes era morado) */
      background: linear-gradient(135deg, #1a1a2e 0%, #123a63 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .login-card h1 {
      font-size: 18px;
      color: #1a1a2e;
      margin-bottom: 4px;
      text-align: center;
    }
    .login-card .subtitle {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #1565c0;
      box-shadow: 0 0 0 3px rgba(21,101,192,0.18);
    }
    /* Ver / ocultar contraseña: los dos ojos viven dentro del botón y se
       alternan con aria-pressed (sin tocar estilos desde el JS). */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      border-radius: 6px;
      color: #6b7280;
      cursor: pointer;
    }
    .pw-toggle:hover { background: #f3f4f6; color: #374151; }
    .pw-toggle:focus-visible { outline: 2px solid #1565c0; outline-offset: 1px; }
    .pw-toggle svg { width: 18px; height: 18px; }
    .pw-toggle .peek-hide { display: none; }
    .pw-toggle[aria-pressed="true"] .peek-show { display: none; }
    .pw-toggle[aria-pressed="true"] .peek-hide { display: block; }
    /* Aviso de Bloq Mayús (el [hidden] tiene que ganarle al display:flex) */
    .caps-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 6px 10px;
      font-size: 12px;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 6px;
    }
    .caps-hint[hidden] { display: none; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #1565c0;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 6px;
    }
    .btn:hover { background: #1257a8; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-outline {
      background: none;
      border: 1px solid #d1d5db;
      color: #374151;
      margin-top: 10px;
    }
    .btn-outline:hover { background: #f9fafb; }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .error-msg.show { display: block; }
    .register-fields { display: none; }
    .register-fields.show { display: block; }
    #register-btn { margin-top: 12px; }
    /* Casilla de términos del alta: el `required` la vuelve obligatoria y el
       navegador no dispara el submit (ni el onsubmit) hasta que esté marcada. */
    .terms { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0 12px; font-size: 13px; color: #374151; line-height: 1.45; }
    .terms input { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px; accent-color: #1565c0; cursor: pointer; }
    .terms a { color: #1565c0; }
    .legal-pie { text-align: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid #e2e4e8; font-size: 12px; color: #6b7280; line-height: 1.5; }
    .legal-pie a { color: #6b7280; text-decoration: none; }
    .legal-pie a:hover { color: #1565c0; text-decoration: underline; }
    /* Móvil: la tarjeta ocupa TODA la pantalla. Antes se veía como una tarjeta
       chica flotando en el centro (el layout de escritorio con 420px de tope).
       `100dvh` en vez de `100vh` para que el alto siga a la barra del navegador
       del celular, y sin centrado vertical: el contenido crece hacia abajo (con
       el alta abierta el centrado dejaría el formulario cortado arriba). */
    @media (max-width: 600px) {
      body { padding: 0; align-items: stretch; }
      .login-card {
        max-width: none;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
        padding: 40px 22px 32px;
      }
      .login-card h1 { font-size: 22px; }
      .login-card .subtitle { font-size: 13px; margin-bottom: 20px; }
      .form-group label { font-size: 14px; }
      /* Campos a 16px: con menos, iOS hace zoom solo al enfocar el campo */
      .form-group input, .btn { font-size: 16px; }
      .form-group input { padding: 12px 14px; }
      .pw-toggle { width: 38px; height: 38px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="/logo-600.jpg" alt="Contador507" style="display:block;max-width:200px;height:auto;margin:0 auto 16px">
    <h1>Inicia sesión</h1>
    <p class="subtitle">Contabilidad inteligente para Panamá</p>
    <div class="error-msg" id="error-msg" role="alert" aria-live="polite"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" placeholder="tu@empresa.com" required autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <div class="pw-wrap">
          <input type="password" id="login-password" placeholder="••••••" required autocomplete="current-password">
          <button type="button" class="pw-toggle" data-pw="login-password" aria-pressed="false" aria-label="Mostrar contraseña">
            <svg class="peek-show" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <svg class="peek-hide" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L9.88 9.88"></path></svg>
          </button>
        </div>
        <div class="caps-hint" id="caps-hint" hidden>⇪ Bloq Mayús está activado</div>
      </div>
      <button type="submit" class="btn" id="login-submit-btn">Iniciar Sesión</button>
    </form>
    <a href="/forgot-password.html" style="display:block;text-align:center;margin-top:12px;color:#1565c0;text-decoration:none;font-size:13px">¿Olvidaste tu contraseña?</a>

    <button class="btn btn-outline" onclick="toggleRegister()" id="toggle-register-btn">Crear nueva empresa</button>

    <!-- Register Form -->
    <div class="register-fields" id="register-fields">
      <hr style="border:none;border-top:1px solid #e5e7eb;margin:16px 0">
      <p style="font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:10px">Registrar nueva empresa</p>
      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-name">Tu nombre</label>
          <input type="text" id="reg-name" placeholder="Juan Pérez" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="reg-email">Correo electrónico</label>
          <input type="email" id="reg-email" placeholder="juan@empresa.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="reg-password">Contraseña (mín. 6 caracteres)</label>
          <div class="pw-wrap">
            <input type="password" id="reg-password" placeholder="••••••" required minlength="6" autocomplete="new-password">
            <button type="button" class="pw-toggle" data-pw="reg-password" aria-pressed="false" aria-label="Mostrar contraseña">
              <svg class="peek-show" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              <svg class="peek-hide" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L9.88 9.88"></path></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-company">Nombre de la empresa</label>
          <input type="text" id="reg-company" placeholder="Mi Negocio SA" required autocomplete="organization">
        </div>
        <div class="form-group">
          <label for="reg-taxid">RUC (opcional)</label>
          <input type="text" id="reg-taxid" placeholder="##-#####-##">
        </div>
        <label class="terms" for="reg-terms">
          <input type="checkbox" id="reg-terms" required>
          <span>Acepto los <a href="/terminos-y-condiciones.html" target="_blank" rel="noopener">Términos y Condiciones</a> y la <a href="/politica-de-privacidad.html" target="_blank" rel="noopener">Política de Privacidad</a>.</span>
        </label>
        <button type="submit" class="btn" id="register-submit-btn">Crear Empresa y Comenzar</button>
      </form>
    </div>

    <p class="legal-pie">
      Al crear una cuenta aceptas los <a href="/terminos-y-condiciones.html">Términos y Condiciones</a><br>
      y la <a href="/politica-de-privacidad.html">Política de Privacidad</a>.
    </p>
  </div>

  <script>
    const API_URL = window.location.origin + '/api';

    // Si ya tiene sesión, validar que sea REAL (el token puede estar expirado):
    // solo redirigir al chat si /api/auth/me responde OK; si no, limpiar el
    // token y mostrar el login (evita el ida y vuelta login↔panel en blanco).
    const _storedToken = localStorage.getItem('agt_token');
    if (_storedToken) {
      fetch(`${API_URL}/auth/me`, { headers: { Authorization: 'Bearer ' + _storedToken } })
        .then(r => {
          if (r.ok) { window.location.href = '/'; }
          else {
            localStorage.removeItem('agt_token');
            localStorage.removeItem('agt_user');
          }
        })
        .catch(() => { /* red caída: dejar el login visible */ });
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('show');
    }
    function hideError() {
      document.getElementById('error-msg').classList.remove('show');
    }

    // Ver / ocultar contraseña: el botón solo cambia su aria-pressed y el CSS
    // alterna los dos ojos (ver .pw-toggle en el <style>).
    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.pw);
        if (!input) return;
        const mostrar = input.type === 'password';
        input.type = mostrar ? 'text' : 'password';
        btn.setAttribute('aria-pressed', String(mostrar));
        btn.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
      });
    });

    // Aviso de Bloq Mayús sobre el campo de contraseña (causa clásica de
    // "no me entra la contraseña", sobre todo en escritorio).
    (function vigilarBloqMayus() {
      const input = document.getElementById('login-password');
      const hint = document.getElementById('caps-hint');
      if (!input || !hint) return;
      const revisar = (e) => {
        if (typeof e.getModifierState !== 'function') return;
        hint.hidden = !e.getModifierState('CapsLock');
      };
      input.addEventListener('keydown', revisar);
      input.addEventListener('keyup', revisar);
      input.addEventListener('blur', () => { hint.hidden = true; });
    })();

    function toggleRegister() {
      const fields = document.getElementById('register-fields');
      const btn = document.getElementById('toggle-register-btn');
      fields.classList.toggle('show');
      btn.textContent = fields.classList.contains('show') ? '← Volver al inicio de sesión' : 'Crear nueva empresa';
      hideError();
    }

    function saveAuth(data) {
      localStorage.setItem('agt_token', data.token);
      localStorage.setItem('agt_user', JSON.stringify(data.user));
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Iniciando sesión...';

      try {
        const res = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || 'Error al iniciar sesión'); btn.disabled = false; btn.textContent = 'Iniciar Sesión'; return; }

        saveAuth(data);
        window.location.href = '/';
      } catch {
        showError('Error de conexión. Verifica que el servidor esté funcionando.');
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideError();
      const btn = document.getElementById('register-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Creando empresa...';

      try {
        const res = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-password').value,
            companyName: document.getElementById('reg-company').value,
            companyTaxId: document.getElementById('reg-taxid').value || undefined,
          }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error || 'Error al registrar'); btn.disabled = false; btn.textContent = 'Crear Empresa y Comenzar'; return; }

        saveAuth(data);
        window.location.href = '/';
      } catch {
        showError('Error de conexión. Verifica que el servidor esté funcionando.');
        btn.disabled = false;
        btn.textContent = 'Crear Empresa y Comenzar';
      }
    }
  </script>
</body>
</html>
