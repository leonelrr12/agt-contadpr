<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador507 — Contraseña y Verificación</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="stylesheet" href="styles.css?v=30">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%); font-family:system-ui,-apple-system,sans-serif; }
    .card { background:#fff; border-radius:12px; padding:32px; width:100%; max-width:420px; box-shadow:0 8px 24px rgba(0,0,0,0.25); }
    .card h1 { margin:0 0 4px 0; font-size:20px; color:#1a1a2e; }
    .card p.sub { margin:0 0 20px 0; color:#6b7280; font-size:13px; }
    .card label { display:block; font-size:12px; color:#6b7280; margin-bottom:4px; }
    .card input { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; box-sizing:border-box; margin-bottom:14px; }
    .card button { width:100%; padding:12px; background:#1565c0; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
    .card button:disabled { opacity:0.6; cursor:wait; }
    .msg { padding:12px 14px; border-radius:8px; font-size:13px; margin:0 0 14px 0; display:none; }
    .msg.ok { display:block; background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
    .msg.err { display:block; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .back { display:block; text-align:center; margin-top:16px; color:#1565c0; text-decoration:none; font-size:13px; }
    .logo { text-align:center; margin-bottom:16px; }
    .logo img { height:44px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><a href="/"><img src="/Logo2.png" alt="Contador507"></a></div>

    <!-- Modo: solicitar enlace de recuperación -->
    <div id="view-forgot">
      <h1>¿Olvidaste tu contraseña?</h1>
      <p class="sub">Escribe tu email y te enviaremos un enlace para restablecerla.</p>
      <div id="msg-forgot" class="msg"></div>
      <label>Email</label>
      <input type="email" id="forgot-email" placeholder="tu@correo.com">
      <button id="forgot-btn" onclick="handleForgot()">Enviar enlace</button>
      <a class="back" href="/login.html">← Volver al inicio de sesión</a>
    </div>

    <!-- Modo: nueva contraseña -->
    <div id="view-reset" style="display:none">
      <h1>Nueva contraseña</h1>
      <p class="sub">Mínimo 6 caracteres. El enlace expira en 30 minutos.</p>
      <div id="msg-reset" class="msg"></div>
      <label>Nueva contraseña</label>
      <input type="password" id="reset-password" placeholder="••••••••">
      <label>Confirmar contraseña</label>
      <input type="password" id="reset-password2" placeholder="••••••••">
      <button id="reset-btn" onclick="handleReset()">Guardar contraseña</button>
      <a class="back" href="/login.html">← Volver al inicio de sesión</a>
    </div>

    <!-- Modo: verificando email -->
    <div id="view-verify" style="display:none">
      <h1>Verificando tu email…</h1>
      <div id="msg-verify" class="msg"></div>
      <a class="back" href="/login.html">← Ir al inicio de sesión</a>
    </div>
  </div>

  <script src="js/shared.js?v=1"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const mode = params.get('mode') || 'forgot';

    function show(el, msg, ok) {
      el.style.display = 'block';
      el.className = 'msg ' + (ok ? 'ok' : 'err');
      el.textContent = msg;
    }

    async function handleForgot() {
      const email = document.getElementById('forgot-email').value.trim();
      const msg = document.getElementById('msg-forgot');
      if (!email) { show(msg, 'Escribe tu email', false); return; }
      document.getElementById('forgot-btn').disabled = true;
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const d = await res.json();
        show(msg, d.message || d.error || 'Error', res.ok);
      } catch (e) {
        show(msg, 'Error de conexión', false);
      } finally {
        document.getElementById('forgot-btn').disabled = false;
      }
    }

    async function handleReset() {
      const password = document.getElementById('reset-password').value;
      const password2 = document.getElementById('reset-password2').value;
      const msg = document.getElementById('msg-reset');
      if (!password || password.length < 6) { show(msg, 'La contraseña debe tener al menos 6 caracteres', false); return; }
      if (password !== password2) { show(msg, 'Las contraseñas no coinciden', false); return; }
      document.getElementById('reset-btn').disabled = true;
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const d = await res.json();
        show(msg, d.message || d.error || 'Error', res.ok);
        if (res.ok) setTimeout(() => { window.location = '/login.html'; }, 1800);
      } catch (e) {
        show(msg, 'Error de conexión', false);
      } finally {
        document.getElementById('reset-btn').disabled = false;
      }
    }

    async function handleVerify() {
      const msg = document.getElementById('msg-verify');
      try {
        const res = await fetch(`/api/auth/verify-email?token=${encodeURIComponent(token)}`);
        const d = await res.json();
        show(msg, d.message || d.error || 'Error', res.ok);
        if (res.ok) setTimeout(() => { window.location = '/login.html'; }, 1800);
      } catch (e) {
        show(msg, 'Error de conexión', false);
      }
    }

    // Seleccionar vista según el modo
    if (mode === 'reset' && token) {
      document.getElementById('view-forgot').style.display = 'none';
      document.getElementById('view-reset').style.display = 'block';
    } else if (mode === 'verify' && token) {
      document.getElementById('view-forgot').style.display = 'none';
      document.getElementById('view-verify').style.display = 'block';
      handleVerify();
    }
  </script>
</body>
</html>
