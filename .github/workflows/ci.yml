name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma (tipos)
        run: npm run db:generate

      - name: Tests (agents)
        run: npm run test --workspace packages/agents

      - name: Typecheck API + packages
        run: npx tsc --noEmit -p apps/api/tsconfig.json
